<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Vitnik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 24px;
      color: #222;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header p {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    .masonry-grid {
      column-count: 4;
      column-gap: 15px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 1100px) { .masonry-grid { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-grid { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-grid { column-count: 1; } }

    .card {
      break-inside: avoid;
      margin-bottom: 15px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      line-height: 1.3;
    }
    .download-btn {
      display: inline-block;
      text-align: center;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .download-btn:hover { background-color: #333333; }
    #loading { text-align: center; font-size: 16px; color: #666; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo Vitnik</h1>
    <p>Sincronizado directamente con Google Drive</p>
  </header>

  <div id="loading">Cargando catálogo...</div>
  <div class="masonry-grid" id="catalog"></div>

  <script>
    const FOLDER_ID = '16a2j_KX-I9yXtcCsITWEmxuVtNrDXyeG';
    const catalogContainer = document.getElementById('catalog');
    const loadingText = document.getElementById('loading');

    async function fetchDriveFiles() {
      try {
        const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://drive.google.com/embeddedfolderview?id=' + FOLDER_ID)}`);
        const text = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const items = doc.querySelectorAll('.flip-entry');

        loadingText.style.display = 'none';

        if (items.length === 0) {
          catalogContainer.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No se encontraron archivos en la carpeta compartida.</p>';
          return;
        }

        items.forEach(item => {
          const id = item.getAttribute('id')?.replace('entry-', '');
          const titleEl = item.querySelector('.flip-entry-title');
          const title = titleEl ? titleEl.textContent.trim() : 'Producto Vitnik';

          if (id) {
            const previewUrl = `https://lh3.google.com/u/0/d/${id}`;
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${id}`;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <img src="${previewUrl}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600?text=Vista+Previa'">
              <div class="card-info">
                <div class="card-title">${title}</div>
                <a href="${downloadUrl}" target="_blank" class="download-btn">Descargar Archivo</a>
              </div>
            `;
            catalogContainer.appendChild(card);
          }
        });
      } catch (error) {
        loadingText.textContent = 'Error al cargar los archivos. Asegurate de que la carpeta sea pública.';
      }
    }

    fetchDriveFiles();
  </script>
</body>
</html>
