<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Vitnik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    header h1 {
      font-size: 24px;
      color: #222;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header p {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }
    
    /* Layout Mosaico Masonry / Pinterest puro */
    .masonry-grid {
      column-count: 4;
      column-gap: 15px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 1100px) { .masonry-grid { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-grid { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-grid { column-count: 1; } }

    .card {
      break-inside: avoid;
      margin-bottom: 15px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    .card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .card-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      line-height: 1.3;
    }
    .download-btn {
      display: inline-block;
      text-align: center;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.2s ease;
    }
    .download-btn:hover {
      background-color: #333333;
    }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo Vitnik</h1>
    <p>Visualización de productos y descargas directas</p>
  </header>

  <div class="masonry-grid" id="catalog">
    <!-- Los elementos se cargan automáticamente aquí -->
  </div>

  <script>
    // Lista de productos (puedes agregar o modificar enlaces según tu Google Sheet)
    const items = [
      {
        nombre: "Fechas de Cierre",
        preview: "https://lh3.google.com/u/0/d/11mBByO2y8qV-B_L3OaT-yM8p9sL", 
        download: "https://drive.google.com/uc?export=download&id=11mBByO2y8qV-B_L3OaT-yM8p9sL"
      }
    ];

    const catalogContainer = document.getElementById('catalog');

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.preview}" alt="${item.nombre}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600?text=Vista+Previa+No+Disponible'">
        <div class="card-info">
          <div class="card-title">${item.nombre}</div>
          <a href="${item.download}" target="_blank" class="download-btn">Descargar Archivo</a>
        </div>
      `;
      catalogContainer.appendChild(card);
    });
  </script>
</body>
</html>
