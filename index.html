<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Vitnik</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f7f7;
      padding: 20px;
    }
    header { text-align: center; margin-bottom: 25px; }
    header h1 { font-size: 24px; color: #222; letter-spacing: 1px; text-transform: uppercase; }
    header p { font-size: 14px; color: #666; margin-top: 5px; }
    
    .masonry-grid {
      column-count: 4;
      column-gap: 15px;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 1100px) { .masonry-grid { column-count: 3; } }
    @media (max-width: 768px)  { .masonry-grid { column-count: 2; } }
    @media (max-width: 480px)  { .masonry-grid { column-count: 1; } }

    .card {
      break-inside: avoid;
      margin-bottom: 15px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }
    .card img { width: 100%; height: auto; display: block; object-fit: contain; }
    .card-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-title { font-size: 14px; font-weight: 600; color: #333; }
    .download-btn {
      display: inline-block;
      text-align: center;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }
    #loading { text-align: center; font-size: 16px; color: #666; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo Vitnik</h1>
    <p>Catálogo visual oficial</p>
  </header>

  <div id="loading">Cargando productos...</div>
  <div class="masonry-grid" id="catalog"></div>

  <script>
    // PEGA AQUÍ TU ENLACE CSV DE GOOGLE SHEETS
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqmYTtlvjIFZdjeerW7O7lvkU31JMMEaL5hmBLjPCpf6HPXXrl1oeg5qV3gXtVJiUIv1Dep5sbuc4S/pub?output=csv';

    async function loadCatalog() {
      const loadingText = document.getElementById('loading');
      const catalogContainer = document.getElementById('catalog');

      try {
        const response = await fetch(SHEET_CSV_URL);
        const data = await response.text();
        const rows = data.split('\n').slice(1); // Omitir encabezado

        loadingText.style.display = 'none';

        rows.forEach(row => {
          const columns = row.split(',');
          if (columns.length >= 2) {
            const nombre = columns[0] ? columns[0].replace(/"/g, '').trim() : 'Producto';
            const previewUrl = columns[1] ? columns[1].replace(/"/g, '').trim() : '';
            const downloadUrl = columns[2] ? columns[2].replace(/"/g, '').trim() : previewUrl;

            if (previewUrl && previewUrl.startsWith('http')) {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <img src="${previewUrl}" alt="${nombre}" loading="lazy">
                <div class="card-info">
                  <div class="card-title">${nombre}</div>
                  <a href="${downloadUrl}" target="_blank" class="download-btn">Descargar</a>
                </div>
              `;
              catalogContainer.appendChild(card);
            }
          }
        });
      } catch (error) {
        loadingText.textContent = 'Error al cargar la planilla. Verifica que el CSV esté publicado.';
      }
    }

    loadCatalog();
  </script>
</body>
</html>
